services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        SKIP_TOUR_PACKS: "1"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - heritage_tourpacks:/app/public/tour-packs
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://heritage-api:8000}
    networks:
      - edge
    restart: unless-stopped

volumes:
  heritage_tourpacks:
    name: heritage_tourpacks
    external: true

networks:
  edge:
    name: heritage_net
    external: true
